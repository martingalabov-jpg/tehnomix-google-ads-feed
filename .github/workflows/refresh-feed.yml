name: Refresh Tehnomix Google Ads feed
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 h: 00/06/12/18 UTC = 03:00/09:00/15:00/21:00 Sofia (summer), one hour earlier in winter
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download source
        run: |
          curl -sSf --retry 3 --retry-delay 20 -o google-new.csv \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36" \
            -H "Accept: text/csv,*/*" https://www.tehnomix.bg/media/feed/google-new.csv
          head -1 google-new.csv | grep -q '^ID,Item title,Final URL' || { echo "Source is not the feed CSV (challenge page?)"; head -c 500 google-new.csv; exit 1; }
          src=$(python -c "import csv;print(sum(1 for _ in csv.DictReader(open('google-new.csv',encoding='utf-8-sig'))))")
          echo "source rows=$src"
          [ "$src" -ge 3000 ] || { echo "Source has only $src products - refusing to publish"; exit 1; }
      - name: Build feed
        run: python build_google_ads_feed.py google-new.csv tehnomix-google-ads-feed.csv
      - name: Sanity check (never publish a gutted feed)
        run: |
          rows=$(python -c "import csv;print(sum(1 for _ in csv.DictReader(open('tehnomix-google-ads-feed.csv',encoding='utf-8-sig'))))")
          echo "rows=$rows"
          [ "$rows" -ge 1500 ] || { echo "Only $rows products - refusing to publish"; git checkout -- tehnomix-google-ads-feed.csv; exit 1; }
      - name: Build PMax category feeds (only from a feed that passed the sanity check)
        run: python build_pmax_category_feeds.py tehnomix-google-ads-feed.csv pmax pmax-pages
      - name: Record run (keeps the schedule alive; GitHub pauses scheduled jobs after 60 days without commits)
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tehnomix-google-ads-feed.csv pmax/*.csv pmax-pages/*.csv last_run.txt
          git commit -m "Refresh feed $(date -u +'%F %H:%M UTC')" || echo "nothing to commit"
          git pull --rebase -X theirs origin main
          git push
